[package]
name = "vchain-queryspec-bench"
version = "0.1.0"
edition = "2021"

[dependencies]
vchain-plus = { path = "../vchain-plus" }
anyhow = "1"
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
petgraph = { version = "0.5", features = ["serde-1"] }
num-bigint = "0.4"
num-traits = "0.2"
flate2 = "1"
rayon = "1"

[profile.release]
opt-level = 3
lto = true

[workspace]
